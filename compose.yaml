services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - apache1
      - apache2
    restart: unless-stopped

  apache1:
    image: httpd:2.4
    volumes:
      - ./www:/usr/local/apache2/htdocs:ro
    restart: unless-stopped

  apache2:
    image: httpd:2.4
    volumes:
      - ./www:/usr/local/apache2/htdocs:ro
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-laboratorio}
      POSTGRES_USER: ${POSTGRES_USER:-alumno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-alumno}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-laboratorio}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
